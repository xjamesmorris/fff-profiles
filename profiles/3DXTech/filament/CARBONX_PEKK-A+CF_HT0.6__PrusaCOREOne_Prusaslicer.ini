# 3DXTech PEKK-A+CF filament profile, extracted from PrusaSlicer 2.9.6 config bundle
# Import via File > Import > Import Config Bundle
# Requires PrusaSlicer 2.9.6+ with Prusa system profiles 2.5.11+ (Core One with HT400 hotend, 0.6 mm nozzle)

[filament:3DXTech PEKK-A+CF @COREONE HT0.6 experimental]
bed_temperature = 120
bridge_fan_speed = 20
chamber_minimal_temperature = 40
chamber_temperature = 55
compatible_printers = 
compatible_printers_condition = printer_model=="COREONE" and nozzle_diameter[0]==0.6 and ! nozzle_high_flow[0] and printer_notes=~/.*HT400.*/
compatible_prints = 
compatible_prints_condition = notes=~/.*HT_HOTEND_HT.*/
cooling = 1
cooling_perimeter_transition_distance = 10
cooling_slowdown_logic = uniform_cooling
custom_parameters_filament = ""
disable_fan_first_layers = 4
enable_dynamic_fan_speeds = 0
end_filament_gcode = "; Filament-specific end gcode"
extrusion_multiplier = 0.98
fan_always_on = 0
fan_below_layer_time = 5
filament_abrasive = 1
filament_colour = #FB0207
filament_cooling_final_speed = 2.5
filament_cooling_initial_speed = 5
filament_cooling_moves = 3
filament_cost = 333.33
filament_density = 1.33
filament_deretract_speed = nil
filament_diameter = 1.75
filament_flush_speed = 0
filament_flush_volume = 0
filament_infill_max_crossing_speed = 140
filament_infill_max_speed = 0
filament_load_time = 10.9
filament_loading_speed = 10
filament_loading_speed_start = 50
filament_max_volumetric_speed = 6
filament_minimal_purge_on_wipe_tower = 35
filament_multitool_ramming = 0
filament_multitool_ramming_flow = 10
filament_multitool_ramming_volume = 10
filament_notes = "2026-10-16\n- WIP profile based on PPS-CF and VM profiles, for initial check. Not yet calibrated.\n"
filament_purge_multiplier = 100%
filament_ramming_parameters = "250 100 42.4194 42.4194 42.4194 42.4194 42.4194| 0.05 42.4387 0.45 42.4387 0.95 42.4387 1.45 42.4387 1.95 42.4387 2.45 42.4387 2.95 42.4387 3.45 42.4387 3.95 42.4387 4.45 42.4387 4.95 42.4387"
filament_retract_before_travel = nil
filament_retract_before_wipe = nil
filament_retract_layer_change = nil
filament_retract_length = nil
filament_retract_length_toolchange = nil
filament_retract_lift = nil
filament_retract_lift_above = nil
filament_retract_lift_below = nil
filament_retract_restart_extra = nil
filament_retract_restart_extra_toolchange = nil
filament_retract_speed = nil
filament_seam_gap_distance = nil
filament_settings_id = ""
filament_shrinkage_compensation_xy = 0%
filament_shrinkage_compensation_z = 0%
filament_soluble = 0
filament_spool_weight = 0
filament_stamping_distance = 45
filament_stamping_loading_speed = 26.5
filament_toolchange_delay = 0
filament_travel_lift_before_obstacle = nil
filament_travel_max_lift = nil
filament_travel_ramping_lift = nil
filament_travel_slope = nil
filament_type = PEKK-A
filament_unload_time = 8.9
filament_unloading_speed = 100
filament_unloading_speed_start = 100
filament_vendor = 3DXTech
filament_wipe = nil
first_layer_bed_temperature = 120
first_layer_temperature = 375
full_fan_speed_layer = 0
idle_temperature = 210
inherits = Fiberon PPS-CF @COREONE HT0.6
max_fan_speed = 20
min_fan_speed = 10
min_print_speed = 15
overhang_fan_speed_0 = 0
overhang_fan_speed_1 = 0
overhang_fan_speed_2 = 0
overhang_fan_speed_3 = 0
slowdown_below_layer_time = 5
start_filament_gcode = "M572 S{if nozzle_diameter[filament_extruder_id]==0.4}0.02{elsif nozzle_diameter[filament_extruder_id]==0.6}0.012{else}0{endif}\nM142 S50 ; set heatbreak target temp"
temperature = 375

